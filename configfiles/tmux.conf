# Appearance
# set -g status-style bg=#1F1F28
# setw -g window-status-format "#[fg=#1F1F28]#[bg=#223249] #I #[bg=#1F1F28]#[fg=#76946A] #W "
# setw -g window-status-current-format "#[fg=#1F1F28]#[bg=#7E9CD8] * #[fg=#1F1F28]#[bg=#76946A] #W "
# set -g status-left ''
# set -g status-right '#[fg=#C8C093][ #[fg=#98BB6C]#S #[fg=#C8C093]]'

bind | split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Copy/Paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Restore clear and kill to end functionality lost by above remappings
bind C-l send-keys 'C-l'
bind C-k send-keys 'C-k'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind a run-shell 'idx=$(tmux display -p "#I"); last=$(tmux list-windows | tail -1 | cut -d: -f1); if [ "$idx" -eq 1 ]; then tmux swap-window -t "$last"; tmux select-window -t "$last"; else tmux swap-window -t -1; tmux select-window -t -1; fi'
bind s run-shell 'idx=$(tmux display -p "#I"); last=$(tmux list-windows | tail -1 | cut -d: -f1); if [ "$idx" -eq "$last" ]; then tmux swap-window -t 1; tmux select-window -t 1; else tmux swap-window -t +1; tmux select-window -t +1; fi'

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# increase scrollback lines
set -g history-limit 10000

#reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# turn on focus events for vim autoread (advice from vim :checkhealth)
set-option -g focus-events on

# auto window rename
set-option -g status-interval 1
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# needed for trucolor support according to vim :checkhealth
set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# stop annoying delay leaving insert mode in vim
set -s escape-time 0

#use vim keybindings in copy mode
setw -g mode-keys vi

#Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send -X begin-selection

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter

set -g default-shell $SHELL

# macOS clipboard integration
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'wave'
set -g @ukiyo-ignore-window-colors true
set -g @ukiyo-plugins 'battery cpu-usage ram-usage'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
